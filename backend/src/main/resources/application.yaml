spring:
  application:
    name: financaspro-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:hml}
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:192.168.15.10}:${DB_PORT:5432}/${DB_NAME:financaspro}}
    username: ${DB_USERNAME:financaspro_user}
    password: ${DB_PASSWORD:senha_padrao}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 30000
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: America/Sao_Paulo
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: ${PORT:8087}

jwt:
  secret: ${JWT_SECRET:dGVzdGUtY2hhdmUtand0LXNlZ3VyYS1jb20tbWluaW1vLTY0LWNhcmFjdGVyZXMtYWxlYXRvcmlvcy1maW5hbmNhc3Bybw==}
  expiration-ms: ${JWT_EXPIRATION_MS:1200000}

app:
  upload-dir: ${UPLOAD_DIR:/app/uploads}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3004}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
